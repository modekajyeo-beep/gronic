<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>멀티플레이어 액션 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 로그인 / 캐릭터 선택 화면 -->
    <div id="setup-screen" class="screen">
        <div class="login-container">
            <h1>CHRONO MULTI</h1>
            <p>숫자 4자리 PIN 코드를 입력하거나 게스트로 시작하세요.</p>
            
            <div class="input-group">
                <input type="password" id="user-pin" placeholder="PIN 코드 4자리 (예: 1234)" maxlength="4">
                <input type="text" id="user-nickname" placeholder="신규 닉네임 입력 (최초 1회)">
            </div>

            <div class="char-select-box">
                <p>초기 캐릭터 선택</p>
                <div class="char-cards">
                    <div class="char-card selected" id="card-char1" onclick="selectInitialChar('char1')">
                        <img src="./gojo.png" alt="고죠">
                        <span>고죠</span>
                    </div>
                    <div class="char-card" id="card-char2" onclick="selectInitialChar('char2')">
                        <img src="./luffy.png" alt="루피">
                        <span>루피</span>
                    </div>
                </div>
            </div>

            <button class="btn-primary" onclick="handlePinLogin()">PIN 접속 / 회원가입</button>
            <button class="btn-guest" onclick="handleGuestLogin()">⚡ 게스트로 시작</button>
        </div>
    </div>

    <!-- 2. 로비 화면 -->
    <div id="lobby-screen" class="screen" style="display: none;">
        <div class="lobby-container">
            <h2>대기실 (Lobby)</h2>
            <div class="profile-card">
                <img id="profile-avatar" src="./gojo.png" alt="프로필">
                <div class="profile-info">
                    <span id="profile-nickname">익명</span>
                    <span id="profile-level-badge" class="badge">Lv.1</span>
                </div>
            </div>
            <button class="btn-primary" onclick="enterGame()">🎮 게임 입장하기</button>
            <button class="btn-sub" onclick="openCustomization()">🎨 꾸미기</button>
        </div>
    </div>

    <!-- 2-1. 꾸미기 화면 -->
    <div id="customization-screen" class="screen" style="display: none;">
        <div class="custom-container">
            <h2>캐릭터 꾸미기 (스킨)</h2>
            <div class="preview-box">
                <p>현재 적용된 스킨</p>
                <img id="preview-avatar" src="./gojo.png" alt="미리보기">
                <span id="preview-skin-name">기본 스킨</span>
            </div>
            
            <div class="skin-grid">
                <div class="skin-card selected" onclick="selectSkin('skin1')">
                    <div class="skin-img-box"><span>기본</span></div>
                    <p>기본 스킨</p>
                    <small>준비중</small>
                </div>
                <div class="skin-card" onclick="selectSkin('skin2')">
                    <div class="skin-img-box"><span>스킨2</span></div>
                    <p>스킨 2</p>
                    <small>준비중</small>
                </div>
                <div class="skin-card" onclick="selectSkin('skin3')">
                    <div class="skin-img-box"><span>스킨3</span></div>
                    <p>스킨 3</p>
                    <small>준비중</small>
                </div>
            </div>

            <button class="btn-sub" onclick="closeCustomization()">← 돌아가기</button>
        </div>
    </div>

    <!-- 3. 게임 플레이 화면 -->
    <div id="game-screen" class="screen" style="display: none;">
        <div id="game-hud">
            <span id="hud-level">Lv.1</span>
            <div class="hud-hp-box">
                <span id="hud-hp-label">❤️ HP</span>
                <div class="hp-bar-bg">
                    <div id="hp-fill"></div>
                </div>
                <span id="hp-text">100 / 100</span>
            </div>
            <span id="status">서버 연결 중...</span>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- 모바일 가상 패드 및 스킬 버튼 -->
        <div id="mobile-controls">
            <div class="d-pad">
                <button class="d-btn" id="btn-up">▲</button>
                <div class="d-mid">
                    <button class="d-btn" id="btn-left">◀</button>
                    <button class="d-btn" id="btn-right">▶</button>
                </div>
                <button class="d-btn" id="btn-down">▼</button>
            </div>
            <div class="skill-btns">
                <button class="skill-btn" id="btn-attack">⚔️</button>
                <button class="skill-btn" id="btn-skill1">✨</button>
                <button class="skill-btn" id="btn-skill2">🔥</button>
            </div>
        </div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <div class="gameover-container">
            <h1 class="glow-red">GAME OVER</h1>
            <p>몬스터에게 쓰러졌습니다.</p>
            <button class="btn-primary" onclick="restartGame()">다시 시작</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
