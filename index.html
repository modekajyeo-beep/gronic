<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 캐시 방지 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>실시간 멀티플레이어 게임</title>
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            overflow: hidden;
        }

        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        /* STEP 1: 로그인(설정) 화면 */
        #setup-screen {
            background-image: url('./bg.png');
            background-size: cover;
            background-position: center;
            background-color: #111; 
        }

        #login-box {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 90%;
            width: 400px;
            backdrop-filter: blur(10px);
        }

        #login-box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            color: #00ff88;
            letter-spacing: 1px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #444;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #00ff88;
        }

        .char-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .char-card {
            background-color: rgba(30, 30, 30, 0.8);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .char-card.selected {
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
            background-color: rgba(0, 255, 136, 0.05);
        }

        /* 흰색 배경 투명화(Multiply) 적용을 위해 박스 배경을 흰색으로 변경 */
        .char-img-box {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff; 
        }

        /* HTML 이미지에 multiply 꼼수 적용 */
        .char-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .char-name {
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }

        .char-card.selected .char-name {
            color: #00ff88;
        }

        .primary-btn {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .primary-btn:hover { background-color: #00cc6a; transform: translateY(-2px); }
        .primary-btn:active { transform: translateY(0); }

        /* STEP 2: 대기실(로비) 화면 */
        #lobby-screen {
            display: none;
            background-color: rgba(20, 20, 20, 0.98);
        }

        #user-profile-bar {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(40, 40, 40, 0.8);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #profile-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #00ff88;
            object-fit: contain;
            background-color: #ffffff;
            mix-blend-mode: normal; /* 로비 아바타는 테두리가 있어서 투명화 제외 */
        }

        #profile-info {
            display: flex;
            flex-direction: column;
        }

        #profile-nickname {
            font-weight: 800;
            font-size: 17px;
            color: #ffffff;
        }

        #profile-status {
            font-size: 13px;
            color: #00ff88;
            font-weight: bold;
        }

        .lobby-menu {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 320px;
        }

        .action-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 18px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: #00ff88;
            background-color: #333;
            transform: translateY(-2px);
        }

        .action-btn.start-btn {
            background-color: #0088ff;
            border-color: #0088ff;
        }
        .action-btn.start-btn:hover {
            background-color: #0066cc;
        }

        /* STEP 3: 인게임 화면 */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            max-width: 100%;
            /* 캔버스 꼼수를 위해 배경을 완전 흰색으로 세팅 */
            background-color: #ffffff; 
            border: 4px solid #333;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        #status {
            margin-top: 15px;
            padding: 8px 18px;
            background-color: #222;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #444;
        }

        #dpad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 8px;
        }

        .dpad-btn {
            background-color: #333;
            border: 2px solid #555;
            color: white;
            font-size: 24px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 4px 0 #111;
        }

        .dpad-btn:active { 
            background-color: #555; 
            transform: translateY(4px);
            box-shadow: 0 0 0 #111;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* 잠수(AFK) 화면 */
        #afk-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            background-color: rgba(10, 10, 10, 0.98);
            z-index: 1000;
        }

        #afk-screen h1 {
            color: #ff3333;
            margin-bottom: 10px;
            font-size: 30px;
        }
        
        #afk-screen p {
            color: #aaa;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div id="afk-screen">
        <h1>연결이 종료되었습니다 💤</h1>
        <p>3분 동안 움직임이 없어 로비에서 퇴장되었습니다.</p>
        <button class="primary-btn" style="width: 250px;" onclick="location.reload()">새로고침 후 재접속</button>
    </div>

    <!-- STEP 1: 설정 화면 -->
    <div id="setup-screen" class="overlay-screen">
        <div id="login-box">
            <h2>캐릭터 프로필 생성</h2>
            
            <div class="input-group">
                <label for="nickname-input">닉네임</label>
                <input type="text" id="nickname-input" placeholder="최대 8자 입력" maxlength="8">
            </div>

            <div class="input-group">
                <label>플레이할 캐릭터</label>
                <div class="char-container">
                    <div class="char-card selected" id="card-char1" onclick="selectInitialChar('char1')">
                        <div class="char-img-box">
                            <img src="./gojo.png" alt="고조사토루" id="img-char1" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        </div>
                        <span class="char-name">고조사토루</span>
                    </div>
                    
                    <div class="char-card" id="card-char2" onclick="selectInitialChar('char2')">
                        <div class="char-img-box">
                            <img src="./luffy.png" alt="루피" id="img-char2" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        </div>
                        <span class="char-name">루피</span>
                    </div>
                </div>
            </div>

            <button class="primary-btn" onclick="confirmSetup()">입장하기</button>
        </div>
    </div>

    <!-- STEP 2: 로비 화면 -->
    <div id="lobby-screen" class="overlay-screen">
        <div id="user-profile-bar">
            <img id="profile-avatar" src="" alt="프로필">
            <div id="profile-info">
                <span id="profile-nickname">닉네임</span>
                <span id="profile-status">● 온라인</span>
            </div>
        </div>

        <div class="lobby-menu">
            <button class="action-btn" onclick="alert('꾸미기 기능은 추후 업데이트 될 예정입니다!')">🎨 캐릭터 꾸미기 (준비중)</button>
            <button class="action-btn start-btn" onclick="enterGame()">🎮 게임 공간 입장하기</button>
        </div>
    </div>

    <!-- STEP 3: 게임 화면 -->
    <div id="game-screen">
        <p style="margin: 0 0 15px 0; color: #888; font-size: 14px; font-weight: bold;">조작: PC는 방향키 / 모바일은 화면 버튼</p>
        
        <div id="game-container">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
        </div>

        <div id="status">서버 연결 중...</div>

        <div id="dpad">
            <div class="dpad-btn" id="btn-up">▲</div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn" id="btn-right">▶</div>
            <div class="dpad-btn" id="btn-down">▼</div>
        </div>
    </div>

    <!-- Firebase 및 게임 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI2REmsCMwoaaV4xndPZKpX_EUntnCGk4",
            authDomain: "croos-9aafb.firebaseapp.com",
            databaseURL: "https://croos-9aafb-default-rtdb.firebaseio.com",
            projectId: "croos-9aafb",
            storageBucket: "croos-9aafb.firebasestorage.app",
            messagingSenderId: "314607076707",
            appId: "1:314607076707:web:f15984e304272721e47f56",
            measurementId: "G-K8JR2FBWBY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const CHAR_IMAGES = {
            char1: new Image(),
            char2: new Image()
        };
        CHAR_IMAGES.char1.src = "./gojo.png";
        CHAR_IMAGES.char2.src = "./luffy.png";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const statusEl = document.getElementById("status");

        const myId = "user_" + Math.random().toString(36).substring(2, 9);

        let myPlayer = {
            nickname: "익명",
            charType: "char1",
            x: Math.floor(Math.random() * (canvas.width - 60)),
            y: Math.floor(Math.random() * (canvas.height - 60)),
            size: 55
        };

        let players = {};
        const keysPressed = {};
        let isGameStarted = false;
        let isAFK = false;

        const myRef = ref(db, `players/${myId}`);
        const playersRef = ref(db, 'players');

        // 3분 잠수 체크
        let lastActivityTime = Date.now();
        const AFK_LIMIT = 3 * 60 * 1000;

        function resetActivityTime() {
            if (isAFK) return;
            lastActivityTime = Date.now();
        }

        window.addEventListener('mousemove', resetActivityTime);
        window.addEventListener('keydown', resetActivityTime);
        window.addEventListener('touchstart', resetActivityTime);
        window.addEventListener('click', resetActivityTime);

        setInterval(() => {
            if (isGameStarted && !isAFK && (Date.now() - lastActivityTime > AFK_LIMIT)) {
                isAFK = true;
                isGameStarted = false;
                remove(myRef); 
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("game-screen").style.display = "none";
                document.getElementById("afk-screen").style.display = "flex";
            }
        }, 1000);

        window.selectInitialChar = function(charType) {
            myPlayer.charType = charType;
            document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`card-${charType}`).classList.add('selected');
        };

        window.confirmSetup = function() {
            const inputVal = document.getElementById("nickname-input").value.trim();
            if (!inputVal) {
                alert("멋진 닉네임을 입력해 주세요!");
                return;
            }

            myPlayer.nickname = inputVal;
            document.getElementById("profile-nickname").textContent = myPlayer.nickname;
            
            if(myPlayer.charType === 'char1') {
                document.getElementById("profile-avatar").src = "./gojo.png";
            } else {
                document.getElementById("profile-avatar").src = "./luffy.png";
            }

            document.getElementById("setup-screen").style.display = "none";
            document.getElementById("lobby-screen").style.display = "flex";
            resetActivityTime();
        };

        window.enterGame = function() {
            document.getElementById("lobby-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";

            set(myRef, myPlayer);
            onDisconnect(myRef).remove();
            isGameStarted = true;
            resetActivityTime();
        };

        onValue(playersRef, (snapshot) => {
            players = snapshot.val() || {};
            statusEl.textContent = `현재 서버 인원: ${Object.keys(players).length}명 접속 중`;
        });

        window.addEventListener("keydown", (e) => keysPressed[e.key] = true);
        window.addEventListener("keyup", (e) => keysPressed[e.key] = false);

        function bindTouchBtn(btnId, keyName) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const startHandler = (e) => { e.preventDefault(); keysPressed[keyName] = true; resetActivityTime(); };
            const endHandler = (e) => { e.preventDefault(); keysPressed[keyName] = false; resetActivityTime(); };
            btn.addEventListener("touchstart", startHandler);
            btn.addEventListener("touchend", endHandler);
            btn.addEventListener("mousedown", startHandler);
            btn.addEventListener("mouseup", endHandler);
            btn.addEventListener("mouseleave", endHandler);
        }

        bindTouchBtn("btn-up", "ArrowUp");
        bindTouchBtn("btn-down", "ArrowDown");
        bindTouchBtn("btn-left", "ArrowLeft");
        bindTouchBtn("btn-right", "ArrowRight");

        function updatePosition() {
            if (!isGameStarted || isAFK) return;
            const speed = 4.5;
            let moved = false;

            if (keysPressed["ArrowUp"] && myPlayer.y > 0) { myPlayer.y -= speed; moved = true; }
            if (keysPressed["ArrowDown"] && myPlayer.y < canvas.height - myPlayer.size) { myPlayer.y += speed; moved = true; }
            if (keysPressed["ArrowLeft"] && myPlayer.x > 0) { myPlayer.x -= speed; moved = true; }
            if (keysPressed["ArrowRight"] && myPlayer.x < canvas.width - myPlayer.size) { myPlayer.x += speed; moved = true; }

            if (moved) { set(myRef, myPlayer); }
        }

        function draw() {
            if (!isAFK) { updatePosition(); }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 타일 바닥 느낌의 그리드
            ctx.strokeStyle = "#e0e0e0"; // 배경이 흰색이므로 선을 약간 어둡게 조절
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 캐릭터들 그리기
            Object.keys(players).forEach((id) => {
                const p = players[id];
                const charImg = CHAR_IMAGES[p.charType] || CHAR_IMAGES.char1;

                if (charImg && charImg.complete && charImg.naturalWidth !== 0) {
                    ctx.save();
                    ctx.globalCompositeOperation = "multiply"; // 💡 여기서 흰색 배경을 투명하게 날려줍니다
                    ctx.drawImage(charImg, p.x, p.y, p.size, p.size);
                    ctx.restore();
                } else {
                    ctx.fillStyle = id === myId ? "#00ff88" : "#ff4444";
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }

                // 닉네임 텍스트 배경 (가독성 향상)
                const text = p.nickname || "익명";
                ctx.font = "bold 13px 'Segoe UI', sans-serif";
                const textWidth = ctx.measureText(text).width;
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(p.x + p.size / 2 - textWidth / 2 - 4, p.y - 18, textWidth + 8, 16);

                // 닉네임 텍스트
                ctx.fillStyle = id === myId ? "#00ff88" : "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText(text, p.x + p.size / 2, p.y - 6);
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
