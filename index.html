<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2인 실시간 멀티플레이어 게임</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 20px;
        }

        p {
            margin: 0 0 12px 0;
            color: #aaaaaa;
            font-size: 13px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
        }

        canvas {
            background-color: #2a2a2a;
            display: block;
            max-width: 100%;
            height: auto;
        }

        #status {
            margin-top: 10px;
            padding: 6px 14px;
            background-color: #333333;
            border-radius: 20px;
            font-size: 13px;
        }

        /* 모바일 터치 컨트롤러 */
        #dpad {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .dpad-btn {
            background-color: #444;
            border: 2px solid #666;
            color: white;
            font-size: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .dpad-btn:active {
            background-color: #666;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>

    <!-- Firebase SDK 불러오기 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // ==========================================
        // 1. Firebase 설정 (제공해주신 값 적용)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDI2REmsCMwoaaV4xndPZKpX_EUntnCGk4",
            authDomain: "croos-9aafb.firebaseapp.com",
            databaseURL: "https://croos-9aafb-default-rtdb.firebaseio.com",
            projectId: "croos-9aafb",
            storageBucket: "croos-9aafb.firebasestorage.app",
            messagingSenderId: "314607076707",
            appId: "1:314607076707:web:f15984e304272721e47f56",
            measurementId: "G-K8JR2FBWBY"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ==========================================
        // 2. 게임 변수 및 설정
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const statusEl = document.getElementById("status");

        // 랜덤 유저 ID 및 색상 생성
        const myId = "user_" + Math.random().toString(36).substring(2, 9);
        const myColor = '#' + Math.floor(Math.random()*16777215).toString(16);

        let myPlayer = {
            x: Math.floor(Math.random() * (canvas.width - 40)),
            y: Math.floor(Math.random() * (canvas.height - 40)),
            color: myColor,
            size: 30
        };

        let players = {};
        const keysPressed = {};

        // ==========================================
        // 3. Firebase 데이터 동기화
        // ==========================================
        const myRef = ref(db, `players/${myId}`);
        const playersRef = ref(db, 'players');

        // 내 상태 칠판에 적기
        set(myRef, myPlayer);
        // 창을 닫으면 내 데이터 삭제
        onDisconnect(myRef).remove();

        // 실시간으로 다른 사람 플레이어 위치 받아오기
        onValue(playersRef, (snapshot) => {
            players = snapshot.val() || {};
            const playerCount = Object.keys(players).length;
            statusEl.textContent = `현재 접속자: ${playerCount}명 (내 ID: ${myId.substring(0, 6)})`;
        });

        // ==========================================
        // 4. 입력 처리 (PC 키보드 + 모바일 터치)
        // ==========================================
        window.addEventListener("keydown", (e) => keysPressed[e.key] = true);
        window.addEventListener("keyup", (e) => keysPressed[e.key] = false);

        function bindTouchBtn(btnId, keyName) {
            const btn = document.getElementById(btnId);
            const startHandler = (e) => {
                e.preventDefault();
                keysPressed[keyName] = true;
            };
            const endHandler = (e) => {
                e.preventDefault();
                keysPressed[keyName] = false;
            };

            btn.addEventListener("touchstart", startHandler);
            btn.addEventListener("touchend", endHandler);
            btn.addEventListener("mousedown", startHandler);
            btn.addEventListener("mouseup", endHandler);
            btn.addEventListener("mouseleave", endHandler);
        }

        bindTouchBtn("btn-up", "ArrowUp");
        bindTouchBtn("btn-down", "ArrowDown");
        bindTouchBtn("btn-left", "ArrowLeft");
        bindTouchBtn("btn-right", "ArrowRight");

        // 위치 업데이트
        function updatePosition() {
            const speed = 4;
            let moved = false;

            if (keysPressed["ArrowUp"] && myPlayer.y > 0) {
                myPlayer.y -= speed;
                moved = true;
            }
            if (keysPressed["ArrowDown"] && myPlayer.y < canvas.height - myPlayer.size) {
                myPlayer.y += speed;
                moved = true;
            }
            if (keysPressed["ArrowLeft"] && myPlayer.x > 0) {
                myPlayer.x -= speed;
                moved = true;
            }
            if (keysPressed["ArrowRight"] && myPlayer.x < canvas.width - myPlayer.size) {
                myPlayer.x += speed;
                moved = true;
            }

            // 움직였을 때만 Firebase 칠판 업데이트
            if (moved) {
                set(myRef, myPlayer);
            }
        }

        // ==========================================
        // 5. 화면 렌더링 루프
        // ==========================================
        function draw() {
            updatePosition();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 격자그리기
            ctx.strokeStyle = "#3a3a3a";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 접속해 있는 유저들 그리기
            Object.keys(players).forEach((id) => {
                const p = players[id];
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);

                ctx.strokeStyle = id === myId ? "#ffffff" : "#000000";
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.size, p.size);

                ctx.fillStyle = "#ffffff";
                ctx.font = "12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(id === myId ? "나" : "상대방", p.x + p.size / 2, p.y - 8);
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</head>
<body>
    <h1>2인 실시간 상호작용 공간</h1>
    <p>PC는 방향키, 모바일은 하단 화살표를 누르세요.</p>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <div id="status">연결 중...</div>

    <!-- 모바일 터치 컨트롤러 -->
    <div id="dpad">
        <div class="dpad-btn" id="btn-up">▲</div>
        <div class="dpad-btn" id="btn-left">◀</div>
        <div class="dpad-btn" id="btn-right">▶</div>
        <div class="dpad-btn" id="btn-down">▼</div>
    </div>
</body>
</html>
