<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>실시간 멀티플레이어 RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         AFK 화면
    ========================== -->
    <div id="afk-screen">

        <h1>연결이 종료되었습니다 💤</h1>

        <button
            class="primary-btn"
            style="width:250px;"
            onclick="location.reload()"
        >
            새로고침 후 재접속
        </button>

    </div>


    <!-- =========================
         로그인
    ========================== -->

    <div id="setup-screen" class="overlay-screen">

        <div id="login-box">

            <h2>🔑 4자리 코드로 접속</h2>

            <div class="input-group">
                <input
                    type="password"
                    id="user-pin"
                    maxlength="4"
                    inputmode="numeric"
                    placeholder="4자리 숫자"
                >
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="user-nickname"
                    placeholder="닉네임 (처음 접속시)"
                    maxlength="8"
                >
            </div>

            <div class="input-group">

                <div class="char-container">

                    <div
                        class="char-card selected"
                        id="card-char1"
                        onclick="selectInitialChar('char1')"
                    >
                        <div class="char-img-box">
                            <img src="./gojo.png" alt="캐릭터1">
                        </div>

                        <span class="char-name">
                            고죠
                        </span>
                    </div>


                    <div
                        class="char-card"
                        id="card-char2"
                        onclick="selectInitialChar('char2')"
                    >
                        <div class="char-img-box">
                            <img src="./luffy.png" alt="캐릭터2">
                        </div>

                        <span class="char-name">
                            루피
                        </span>
                    </div>

                </div>

            </div>


            <button
                class="primary-btn"
                onclick="handlePinLogin()"
            >
                게임 접속
            </button>


            <!-- 게스트 버튼 -->
            <button
                class="guest-btn"
                onclick="enterGuestMode()"
            >
                👤 게스트로 시작
            </button>

        </div>

    </div>



    <!-- =========================
         로비
    ========================== -->

    <div id="lobby-screen" class="overlay-screen">

        <div id="user-profile-bar">

            <img
                id="profile-avatar"
                src=""
                alt="프로필"
            >

            <div id="profile-info">

                <div class="profile-row">

                    <span id="profile-level-badge">
                        Lv.1
                    </span>

                    <span id="profile-nickname">
                        닉네임
                    </span>

                </div>

                <!-- HP 표시 -->
                <div class="lobby-hp">
                    ❤️ HP
                    <span id="lobby-hp-text">100 / 100</span>
                </div>

            </div>

        </div>


        <div class="lobby-menu">

            <button
                class="action-btn start-btn"
                onclick="enterGame()"
            >
                🎮 게임 입장하기
            </button>


            <!-- 꾸미기 -->
            <button
                class="action-btn customize-btn"
                onclick="openCustomize()"
            >
                🎨 꾸미기
            </button>

        </div>


        <!-- 꾸미기 창 -->

        <div
            id="customize-screen"
            class="customize-screen"
        >

            <div class="customize-box">

                <h2>🎨 꾸미기</h2>

                <div class="skin-preview">

                    <img
                        id="skin-preview-img"
                        src="./gojo.png"
                        alt="스킨 미리보기"
                    >

                </div>

                <p>
                    여기에 나중에 스킨을 추가하면 됨.
                </p>

                <div class="skin-slots">

                    <button
                        class="skin-slot"
                        onclick="selectSkin('char1')"
                    >
                        기본 스킨
                    </button>

                    <button
                        class="skin-slot"
                        onclick="selectSkin('char2')"
                    >
                        스킨 2
                    </button>

                </div>


                <button
                    class="primary-btn"
                    onclick="closeCustomize()"
                >
                    닫기
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         게임
    ========================== -->

    <div id="game-screen">

        <!-- HUD -->

        <div id="ingame-hud">

            <div id="hud-level">
                Lv.1
            </div>


            <!-- HP -->
            <div class="hud-stat">

                <div class="hud-bar hp-bar">

                    <div
                        id="hud-hp-fill"
                        class="hud-fill"
                    ></div>

                </div>

                <span id="hud-hp-text">
                    HP 100 / 100
                </span>

            </div>


            <!-- 에너지 -->

            <div class="hud-stat">

                <div class="hud-bar energy-bar">

                    <div
                        id="hud-energy-fill"
                        class="hud-fill"
                    ></div>

                </div>

                <span id="hud-energy-text">
                    EN 0 / 100
                </span>

            </div>

        </div>



        <!-- 게임 영역 -->

        <div id="game-container">

            <canvas
                id="gameCanvas"
                width="960"
                height="540"
            ></canvas>

        </div>



        <div id="status">
            서버 연결 중...
        </div>



        <!-- 모바일 조작 -->

        <div id="controls-container">

            <!-- 이동 -->

            <div id="dpad">

                <button
                    class="dpad-btn"
                    id="btn-up"
                >
                    ▲
                </button>

                <button
                    class="dpad-btn"
                    id="btn-left"
                >
                    ◀
                </button>

                <button
                    class="dpad-btn"
                    id="btn-right"
                >
                    ▶
                </button>

                <button
                    class="dpad-btn"
                    id="btn-down"
                >
                    ▼
                </button>

            </div>



            <!-- 스킬 -->

            <div id="skill-pad">

                <button
                    class="skill-btn attack"
                    id="btn-attack"
                >
                    👊
                    <small>평타</small>
                </button>

                <button
                    class="skill-btn skill1"
                    id="btn-skill1"
                >
                    ⚡
                    <small>스킬1</small>
                </button>

                <button
                    class="skill-btn skill2"
                    id="btn-skill2"
                >
                    🔥
                    <small>스킬2</small>
                </button>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="script.js"
    ></script>

</body>
</html>
