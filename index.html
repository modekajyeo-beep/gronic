<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 모바일 캐시 방지 메타 태그 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>2인 실시간 멀티플레이어 게임</title>
    
    <!-- CSS 분리 파일 불러오기 -->
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

    <!-- 1. 오프닝 / 캐릭터 선택 화면 -->
    <div id="character-select-screen">
        <h2>캐릭터를 선택하세요</h2>
        <div class="char-container">
            <div class="char-card">
                <div class="char-img-box">
                    <img src="https://image.zeta-ai.io/profile-image/3ccac6c2-9a72-4105-a1d1-b55e8d0924e4/35e03299-9201-4eea-9323-afac61c9d2ee.jpeg?w=750&q=75&f=webp" alt="캐릭터 1">
                </div>
                <button class="select-btn" onclick="selectCharacter('char1')">선택</button>
            </div>
            
            <div class="char-card">
                <div class="char-img-box">
                    <img src="https://saegchil.co.kr/wp-content/uploads/2022/09/lupi-paiting-saegchil.jpg" alt="캐릭터 2">
                </div>
                <button class="select-btn" onclick="selectCharacter('char2')">선택</button>
            </div>
        </div>
    </div>

    <!-- 2. 게임 메인 화면 -->
    <h1>2인 실시간 상호작용 공간</h1>
    <p>PC는 방향키, 모바일은 하단 화살표를 누르세요.</p>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <div id="status">연결 중...</div>

    <!-- 모바일 터치 컨트롤러 -->
    <div id="dpad">
        <div class="dpad-btn" id="btn-up">▲</div>
        <div class="dpad-btn" id="btn-left">◀</div>
        <div class="dpad-btn" id="btn-right">▶</div>
        <div class="dpad-btn" id="btn-down">▼</div>
    </div>

    <!-- JS 분리 파일 불러오기 (Firebase 모듈 기능 이용) -->
    <script type="module" src="game.js?v=1.0"></script>
</body>
</html>
