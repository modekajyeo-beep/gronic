<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 캐시 방지 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>실시간 멀티플레이어 RPG 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 잠수(AFK) 화면 -->
    <div id="afk-screen">
        <h1>연결이 종료되었습니다 💤</h1>
        <button class="primary-btn" style="width: 250px;" onclick="location.reload()">새로고침 후 재접속</button>
    </div>

    <!-- 4자리 PIN 코드 접속 화면 -->
    <div id="setup-screen" class="overlay-screen">
        <div id="login-box">
            <h2>🔑 4자리 코드로 접속</h2>
            <div class="input-group">
                <input type="password" id="user-pin" maxlength="4" placeholder="4자리 숫자" style="text-align:center; font-size:20px; letter-spacing:5px;">
            </div>
            <div class="input-group">
                <input type="text" id="user-nickname" placeholder="닉네임 (처음 접속시)" maxlength="8">
            </div>
            <div class="input-group">
                <div class="char-container">
                    <div class="char-card selected" id="card-char1" onclick="selectInitialChar('char1')">
                        <div class="char-img-box"><img src="./gojo.png" alt="고조사토루"></div>
                        <span class="char-name">고조사토루</span>
                    </div>
                    <div class="char-card" id="card-char2" onclick="selectInitialChar('char2')">
                        <div class="char-img-box"><img src="./luffy.png" alt="루피"></div>
                        <span class="char-name">루피</span>
                    </div>
                </div>
            </div>
            <button class="primary-btn" onclick="handlePinLogin()">게임 접속</button>
        </div>
    </div>

    <!-- 대기실(로비) 화면 -->
    <div id="lobby-screen" class="overlay-screen">
        <div id="user-profile-bar">
            <img id="profile-avatar" src="" alt="프로필">
            <div id="profile-info">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span id="profile-level-badge">Lv.1</span>
                    <span id="profile-nickname">닉네임</span>
                </div>
            </div>
        </div>
        <div class="lobby-menu">
            <button class="action-btn start-btn" onclick="enterGame()">🎮 게임 입장하기</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen">
        <div id="ingame-hud">
            <span id="hud-level">Lv.1</span>
            <!-- 에너지 게이지 바 추가 -->
            <div class="exp-bar-container" style="width: 150px; background-color: #333; border-color: #ffaa00;">
                <div id="hud-energy-fill" class="exp-bar-fill" style="width: 0%; background: linear-gradient(90deg, #ffcc00, #ff5500);"></div>
                <span id="hud-energy-text" class="exp-bar-text">에너지 0% (폭주 준비중)</span>
            </div>
        </div>
        
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>

        <div id="status">서버 연결 중...</div>

        <!-- 모바일 조작부 -->
        <div id="controls-container">
            <div id="dpad">
                <div class="dpad-btn" id="btn-up">▲</div>
                <div class="dpad-btn" id="btn-left">◀</div>
                <div class="dpad-btn" id="btn-right">▶</div>
                <div class="dpad-btn" id="btn-down">▼</div>
            </div>
            
            <!-- 스킬 버튼부 -->
            <div id="skill-pad">
                <div class="skill-btn" id="btn-attack" style="background:#ddd; color:#000;">👊<br><small>평타</small></div>
                <div class="skill-btn" id="btn-skill1" style="background:#00b8ff;">⚡<br><small>스킬1</small></div>
                <div class="skill-btn" id="btn-skill2" style="background:#ff3366;">🔥<br><small>스킬2</small></div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
