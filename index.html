<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>실시간 멀티플레이어 RPG 게임</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 잠수/연결 종료 화면 -->
    <div id="afk-screen">
        <h1>연결이 종료되었습니다 💤</h1>
        <button class="primary-btn" style="width:250px;" onclick="location.reload()">
            새로고침 후 재접속
        </button>
    </div>

    <!-- 로그인 화면 -->
    <div id="setup-screen" class="overlay-screen">

        <div id="login-box">

            <h2>🔑 4자리 코드로 접속</h2>

            <div class="input-group">
                <input
                    type="password"
                    id="user-pin"
                    maxlength="4"
                    placeholder="4자리 숫자"
                    style="text-align:center; font-size:20px; letter-spacing:5px;"
                >
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="user-nickname"
                    placeholder="닉네임 (처음 접속시)"
                    maxlength="8"
                >
            </div>

            <!-- 캐릭터 선택 -->
            <div class="input-group">
                <div class="char-container">

                    <div
                        class="char-card selected"
                        id="card-char1"
                        onclick="selectInitialChar('char1')"
                    >
                        <div class="char-img-box">
                            <img src="./gojo.png" alt="고죠">
                        </div>
                        <span class="char-name">고죠</span>
                    </div>

                    <div
                        class="char-card"
                        id="card-char2"
                        onclick="selectInitialChar('char2')"
                    >
                        <div class="char-img-box">
                            <img src="./luffy.png" alt="루피">
                        </div>
                        <span class="char-name">루피</span>
                    </div>

                </div>
            </div>

            <button class="primary-btn" onclick="handlePinLogin()">
                게임 접속
            </button>

            <!-- 게스트 -->
            <button class="guest-btn" onclick="startGuestMode()">
                👤 게스트로 시작
            </button>

        </div>
    </div>


    <!-- ========================= -->
    <!-- 로비 -->
    <!-- ========================= -->

    <div id="lobby-screen" class="overlay-screen">

        <div id="user-profile-bar">

            <img id="profile-avatar" src="" alt="프로필">

            <div id="profile-info">

                <div class="profile-name-row">
                    <span id="profile-level-badge">Lv.1</span>
                    <span id="profile-nickname">닉네임</span>
                </div>

            </div>

        </div>

        <div class="lobby-menu">

            <button class="action-btn start-btn" onclick="enterGame()">
                🎮 게임 입장하기
            </button>

            <button class="action-btn customize-btn" onclick="openCustomize()">
                🎨 꾸미기
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 꾸미기 화면 -->
    <!-- ========================= -->

    <div id="customize-screen" class="overlay-screen">

        <div class="customize-box">

            <h2>🎨 캐릭터 꾸미기</h2>

            <div class="customize-preview">

                <div class="preview-title">
                    현재 캐릭터
                </div>

                <img id="customize-preview-img" src="./gojo.png" alt="현재 스킨">

                <div id="customize-preview-name">
                    기본 스킨
                </div>

            </div>


            <div class="skin-title">
                스킨 선택
            </div>

            <div id="skin-grid">

                <!-- JS가 스킨 슬롯을 자동 생성 -->

            </div>


            <button class="back-btn" onclick="closeCustomize()">
                ← 로비로 돌아가기
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 게임 화면 -->
    <!-- ========================= -->

    <div id="game-screen">

        <!-- HUD -->
        <div id="ingame-hud">

            <span id="hud-level">Lv.1</span>

            <!-- HP -->
            <div class="hud-resource hp-resource">

                <div class="resource-bar">
                    <div id="hud-hp-fill" class="resource-fill hp-fill"></div>
                </div>

                <span id="hud-hp-text">
                    ❤️ HP 100 / 100
                </span>

            </div>

            <!-- ENERGY -->
            <div class="hud-resource energy-resource">

                <div class="resource-bar">
                    <div id="hud-energy-fill" class="resource-fill energy-fill"></div>
                </div>

                <span id="hud-energy-text">
                    에너지 0%
                </span>

            </div>

        </div>


        <!-- GAME OVER -->
        <div id="game-over-screen">

            <div class="game-over-box">

                <h1>GAME OVER</h1>

                <p>체력이 모두 소진되었습니다.</p>

                <button class="primary-btn" onclick="restartGame()">
                    🔄 다시 시작
                </button>

                <button class="back-lobby-btn" onclick="returnToLobby()">
                    🏠 로비로
                </button>

            </div>

        </div>


        <!-- 게임 캔버스 -->
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>


        <div id="status">
            서버 연결 중...
        </div>


        <!-- 모바일 조작 -->
        <div id="controls-container">

            <div id="dpad">

                <div class="dpad-btn" id="btn-up">▲</div>
                <div class="dpad-btn" id="btn-left">◀</div>
                <div class="dpad-btn" id="btn-right">▶</div>
                <div class="dpad-btn" id="btn-down">▼</div>

            </div>


            <div id="skill-pad">

                <div
                    class="skill-btn"
                    id="btn-attack"
                    style="background:#ddd; color:#000;"
                >
                    👊
                    <br>
                    <small>평타</small>
                </div>

                <div
                    class="skill-btn"
                    id="btn-skill1"
                    style="background:#00b8ff;"
                >
                    ⚡
                    <br>
                    <small>스킬1</small>
                </div>

                <div
                    class="skill-btn"
                    id="btn-skill2"
                    style="background:#ff3366;"
                >
                    🔥
                    <br>
                    <small>스킬2</small>
                </div>

            </div>

        </div>

    </div>


    <script type="module" src="script.js"></script>

</body>
</html>
